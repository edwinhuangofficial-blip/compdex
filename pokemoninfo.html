<!doctype html>
<html>
  <head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="pokemoninfo.css?v=stat-colors-22" />
    <link rel="stylesheet" href="shared.css" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <!--adds custom font-->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
<script src="settings.js?v=animated-default-6"></script>
    <script src="fetchapi.js?v=evolution-replay-21"></script>
    <script src="evolution.js?v=evolution-replay-21"></script>
    <title>Pokemon Info</title>
    <!--website title-->
  </head>
  <body>
    <!--same bar but the title takes u home-->
    <div class="homepagebar">
      <div class="bar-left">
        <h2 id="homebutton" onclick="window.location.replace('index.html');"><img class="site-logo" src="favicon.svg" alt="" /> CompDex</h2>
        <h3 class="page-label">Pokemon Info</h3>
      </div>
      <div class="bar-mid">
        <div class="searchbarbut">
          <div class="search-input-wrap">
            <input type="search" id="searchbarid" placeholder="Search name or #..." autocomplete="off" spellcheck="false" autocorrect="off" autocapitalize="none" />
            <button type="button" id="clear-search" aria-label="Clear search">
              ×
            </button>
          </div>
          <button id="searchbutton" onclick="pokeSearch()">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="22"
              height="22"
              viewBox="0 0 20 20"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <circle cx="10" cy="10" r="8" />
              <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
          </button>
          <div id="search-dropdown"></div>
        </div>
      </div>

      <div class="bar-right">
        <button id="share-button" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 10.5 6.8-4M8.6 13.5l6.8 4"/></svg><span>Share</span></button>
        <button id="settings-button" type="button">Settings</button>
      </div>
    </div>
    <div id="pokeinfo"></div>
    <form id="pokemon-number-form" class="pokemon-number-nav" novalidate>
      <span id="pokemon-number-status" role="status"></span>
      <button id="previous-pokemon" type="button" disabled>Previous</button>
      <label for="pokemon-number">Pokémon #</label>
      <input id="pokemon-number" type="number" min="1" step="1" required disabled aria-label="Pokémon number" />
      <button id="next-pokemon" type="button" disabled>Next</button>
    </form>
    <div id="ability-tooltip"></div>
    <script>
      const pokename = new URLSearchParams(window.location.search).get(
        "pokemon", //gets pokemon name from the top url
      );

      const abilityCache = {}
      let currentPokemonData = null;
      function updateInfoArtwork() {
        if (!currentPokemonData) return;
        const preferences = window.CompDexSettings.get();
        const { source, pixel: pixelArtwork, animated, fallbacks } = getPokemonArtwork(currentPokemonData.sprites, preferences);
        const image = document.getElementById("pokemon-main-artwork");
        if (!image) return;
        swapPreparedArtwork(image, {source, pixel:pixelArtwork, animated, fallbacks}, preferences).then(changed => {
          if (!changed || !image.isConnected) return;
          const mode = window.CompDexSettings.get().animations;
          if (mode === 'off') return;
          image.getAnimations().forEach(animation => animation.cancel());
          const frames = mode === 'reduced'
            ? [{opacity:0}, {opacity:1}]
            : [{opacity:0, translate:'0 -24px'}, {opacity:1, translate:'0 0'}];
          image.animate(frames, {
            duration:mode === 'reduced' ? 120 : 700,
            easing:mode === 'reduced' ? 'ease-out' : 'cubic-bezier(.22, 1, .36, 1)'
          });
        });
        document.getElementById("info-artwork").value = preferences.artwork;
        syncInfoArtworkMenu();
        document.getElementById("info-shiny").checked = preferences.shiny;
      }
      function syncInfoArtworkMenu() {
        const select = document.getElementById("info-artwork");
        document.getElementById("info-artwork-trigger").textContent = select.selectedOptions[0].textContent;
        document.querySelectorAll(".info-artwork-option").forEach(button => button.setAttribute("aria-checked", String(button.dataset.value === select.value)));
      }
      function closeInfoArtworkMenu() {
        document.getElementById("info-artwork-dropdown").classList.remove("open");
        document.getElementById("info-artwork-trigger").setAttribute("aria-expanded", "false");
        document.getElementById("info-artwork-menu").inert = true;
      }
      const infoFavoriteIds = new Set();
      try {
        const saved = JSON.parse(localStorage.getItem("compdex.favorites.v1") || "[]");
        if (Array.isArray(saved)) saved.filter(id => Number.isInteger(id) && id > 0).forEach(id => infoFavoriteIds.add(id));
      } catch {}
      function syncInfoFavorite() {
        const button = document.getElementById("info-favorite");
        if (!button || !currentPokemonData) return;
        const selected = infoFavoriteIds.has(currentPokemonData.id);
        button.setAttribute("aria-pressed", String(selected));
        button.setAttribute("aria-label", `${selected ? "Unfavorite" : "Favorite"} ${currentPokemonData.name.replace(/-/g, " ")}`);
      }

      async function loadPokemon() {
        const response = await fetch(
          "https://pokeapi.co/api/v2/pokemon/" + pokename,
        );
        if (!response.ok) {
          window.location.href = "notfound.html?pokemon=" + pokename;
          return;
        }
        const data = await response.json();
        currentPokemonData = { id: data.id, name: data.name, sprites: compactPokemonSprites(data.sprites) };
        const numberInput = document.getElementById("pokemon-number");
        numberInput.value = data.id;
        numberInput.disabled = false;
        updatePokemonNavigation();

        const info = document.getElementById("pokeinfo");

        const allTypes = [
          "normal",
          "fire",
          "water",
          "electric",
          "grass",
          "ice",
          "fighting",
          "poison",
          "ground",
          "flying",
          "psychic",
          "bug",
          "rock",
          "ghost",
          "dragon",
          "dark",
          "steel",
          "fairy",
        ];
        const types = data.types.map((t) => t.type.name);

        const typeMultipliers = {};
        const effectiveMultipliers = {};
        allTypes.forEach((t) => (typeMultipliers[t] = 1));

        let abilities = data.abilities.map((a) => a.ability.name);
  

        const typeRelations = await Promise.all(types.map(async type => {
          const response = await fetch("https://pokeapi.co/api/v2/type/" + type);
          return (await response.json()).damage_relations;
        }));
        for (const damageRelations of typeRelations) {
          //adds keys with multipliers for the typing that it takes in damage from
          damageRelations.double_damage_from.forEach((t) => {
            typeMultipliers[t.name] = (typeMultipliers[t.name] ?? 1) * 2;
          });
          damageRelations.half_damage_from.forEach((t) => {
            typeMultipliers[t.name] = (typeMultipliers[t.name] ?? 1) * 0.5;
          });
          damageRelations.no_damage_from.forEach((t) => {
            typeMultipliers[t.name] = 0;
          });
          //adds keys for the types that it does damage to
          damageRelations.double_damage_to.forEach((t) => {
            effectiveMultipliers[t.name] =
              (effectiveMultipliers[t.name] ?? 1) * 2;
          });
        }
        if (abilities.includes("levitate")) {
          //adds ground immunity if pokemon have that ability
          typeMultipliers["ground"] = 0;
        }

        if (abilities.includes("wonder-guard")) {
          //adds immunities for shedinja
          Object.keys(typeMultipliers).forEach((t) => {
            if (typeMultipliers[t] <= 1) {
              typeMultipliers[t] = 0;
            }
          });
        }
          for (const abilityName of abilities){
        fetch("https://pokeapi.co/api/v2/ability/" + abilityName)
        .then(function(res){
          return res.json();
        })
        .then(function(abilityData){
          const englishDesc = abilityData.effect_entries.find(entry => entry.language.name === "en")
          abilityCache[abilityName] = englishDesc?.short_effect || abilityData.flavor_text_entries.find(entry => entry.language.name === "en")?.flavor_text?.replace(/\s+/g, " ") || "No description available.";
        }).catch(() => { abilityCache[abilityName] = "Could not load description."; });
      }

        

        const weaknessesList = Object.keys(typeMultipliers).filter(
          (t) => typeMultipliers[t] > 1,
        );
        const resistancesList = Object.keys(typeMultipliers).filter(
          (t) => typeMultipliers[t] < 1 && typeMultipliers[t] > 0,
        );
        const immunitiesList = Object.keys(typeMultipliers).filter(
          (t) => typeMultipliers[t] === 0,
        );

        const strongAgainstList = Object.keys(effectiveMultipliers).filter(
          (t) => effectiveMultipliers[t] > 1,
        );

        const totalStats = data.stats[0].base_stat + data.stats[1].base_stat + data.stats[2].base_stat + data.stats[3].base_stat + data.stats[4].base_stat + data.stats[5].base_stat;
        const weightKg = (data.weight / 10).toFixed(1);
        const weightLbs = (data.weight / 10 * 2.205).toFixed(1);
        const displayName = reverseTransformName(data.name);

        info.innerHTML = `
        <div class="elements_sidebyside">
          <h1>${displayName} <span class="pokemon-title-number">· #${data.id}</span></h1>
          <button id="info-favorite" type="button" aria-pressed="false" aria-label="Favorite Pokémon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9Z" /></svg></button>
        </div>
        <div class="info-layout"><div class="info-primary"><div class="sprite-stats">
          <div class="sprites">
            <div class="info-artwork-controls">
              <div id="info-artwork-dropdown" class="info-artwork-dropdown">
<select id="info-artwork" aria-label="Artwork style" hidden><option value="hd">HD artwork</option><option value="pixel">Pixel art</option><option value="champions">Modern Models</option><option value="animated">3DS Model</option><option value="animatedPixel">Animated Pixels</option></select>
                <button id="info-artwork-trigger" type="button" aria-label="Artwork style" aria-haspopup="menu" aria-expanded="false" aria-controls="info-artwork-menu">HD artwork</button>
                <div id="info-artwork-menu" class="filter-menu" role="menu" aria-labelledby="info-artwork-trigger" inert>
                  ${[["hd", "HD artwork"], ["pixel", "Pixel art"], ["champions", "Modern Models"], ["animated", "3DS Model"], ["animatedPixel", "Animated Pixels"]].map(([value, label]) => `<button type="button" class="info-artwork-option" role="menuitemradio" aria-checked="false" data-value="${value}">${label}</button>`).join("")}
                </div>
              </div>
              <label for="info-shiny">Shiny <input id="info-shiny" type="checkbox" /></label>
            </div>
            <div class="info-artwork-stage">
            <img id="pokemon-main-artwork" alt="${data.name}" />
            </div>
            <div class="info-artwork-types" aria-label="Pokémon types">${types.map(type => `<span class="type-badge type-${type}">${type}</span>`).join("")}</div>
          </div>
            <div class="stats">
              <div class="stats-header"><h2 class="stats-heading">Base stats</h2><span class="stats-pokemon-name">${displayName} · #${data.id}</span></div>
              <div class="stats-rows">
                ${data.stats.map((entry, index) => `<div class="stat-row">
                  <span class="stat-name">${["HP", "Attack", "Defense", "Sp. Atk", "Sp. Def", "Speed"][index]}</span>
                  <span class="stat-num">${entry.base_stat}</span>
                  <div class="stat-bar-container"><div class="stat-bar stat-${entry.base_stat < 30 ? "red" : entry.base_stat < 60 ? "orange" : entry.base_stat < 90 ? "yellow" : entry.base_stat < 130 ? "green" : "purple"}" style="width: ${Math.min(100, entry.base_stat / 255 * 100)}%"></div></div>
                </div>`).join("")}
              </div>
              <div class="stats-footer">
                <span class="stat-total">Base Stat Total <strong>${totalStats}</strong></span>
                <span class="stat-weight">Weight: ${weightKg} kg / ${weightLbs} lbs</span>
              </div>
              <div class="info-abilities"><h2>Abilities</h2>${data.abilities.map((a) => `<button type="button" class="ability-badge" data-ability="${a.ability.name}" onmouseenter="showAbilityTooltip(event, '${a.ability.name}')" onmousemove="showAbilityTooltip(event, '${a.ability.name}')" onmouseleave="hideAbilityTooltip()" onfocus="showAbilityTooltip(event, '${a.ability.name}')" onblur="hideAbilityTooltip()" onclick="showAbilityTooltip(event, '${a.ability.name}')">${a.ability.name.replace(/-/g, " ")}${a.is_hidden ? '<small>Hidden</small>' : ''}<span class="ability-info-icon" aria-hidden="true">i</span></button>`).join("")}</div>
              </div>
            </div>
        <section class="info-matchups" aria-label="Type matchups">
          <div class="matchups-header"><h2>Type matchups</h2></div>
          ${strongAgainstList.length > 0 ? `<div class="matchup-row"><h3>STAB <small>1.5x</small></h3><div class="matchup-badges">${strongAgainstList.map(t => `<span class="type-badge type-${t}">${t}</span>`).join("")}</div></div>` : ""}
          ${weaknessesList.length > 0 ? `<div class="matchup-row"><h3>Weaknesses</h3><div class="matchup-badges">${weaknessesList.map(t => `<span class="type-badge-multipliers type-${t}">${t} ${typeMultipliers[t]}×</span>`).join("")}</div></div>` : ""}
          ${resistancesList.length > 0 ? `<div class="matchup-row"><h3>Resistances</h3><div class="matchup-badges">${resistancesList.map(t => `<span class="type-badge-multipliers type-${t}">${t} ${typeMultipliers[t]}×</span>`).join("")}</div></div>` : ""}
          ${immunitiesList.length > 0 ? `<div class="matchup-row"><h3>Immunities</h3><div class="matchup-badges">${immunitiesList.map(t => `<span class="type-badge-multipliers type-${t}">${t} 0×</span>`).join("")}${abilities.includes("levitate") ? '<small class="matchup-note">Ground immunity requires Levitate.</small>' : ""}</div></div>` : ""}
        </section>
        </div><section class="info-evolution" aria-label="Evolution line"><h2>Evolution line</h2><div id="evolution-content" aria-live="polite" aria-busy="true">Loading evolution line…</div></section></div>
        `;
        updateInfoArtwork();
        window.CompDexEvolution.load(data);
        syncInfoFavorite();
        document.getElementById("info-favorite").addEventListener("click", () => {
          if (infoFavoriteIds.has(data.id)) infoFavoriteIds.delete(data.id);
          else infoFavoriteIds.add(data.id);
          try { localStorage.setItem("compdex.favorites.v1", JSON.stringify([...infoFavoriteIds])); } catch {}
          syncInfoFavorite();
        });
        const changeArtwork = () => window.CompDexSettings.setArtwork(document.getElementById("info-artwork").value, document.getElementById("info-shiny").checked);
        document.getElementById("info-artwork").addEventListener("change", changeArtwork);
        document.getElementById("info-shiny").addEventListener("change", changeArtwork);
        const artworkDropdown = document.getElementById("info-artwork-dropdown");
        const artworkTrigger = document.getElementById("info-artwork-trigger");
        const artworkMenu = document.getElementById("info-artwork-menu");
        const artworkOptions = [...artworkMenu.querySelectorAll("button")];
        const openArtworkMenu = () => {
          artworkDropdown.classList.add("open");
          artworkTrigger.setAttribute("aria-expanded", "true");
          artworkMenu.inert = false;
          artworkOptions.find(button => button.dataset.value === document.getElementById("info-artwork").value).focus();
        };
        artworkTrigger.addEventListener("click", () => artworkDropdown.classList.contains("open") ? closeInfoArtworkMenu() : openArtworkMenu());
        artworkTrigger.addEventListener("keydown", event => {
          if (["ArrowDown", "ArrowUp"].includes(event.key)) { event.preventDefault(); openArtworkMenu(); }
        });
        artworkOptions.forEach(button => button.addEventListener("click", () => {
          document.getElementById("info-artwork").value = button.dataset.value;
          closeInfoArtworkMenu();
          artworkTrigger.focus();
          changeArtwork();
        }));
        artworkMenu.addEventListener("keydown", event => {
          const index = artworkOptions.indexOf(document.activeElement);
          if (["ArrowDown", "ArrowUp", "Home", "End"].includes(event.key)) {
            event.preventDefault();
            const next = event.key === "Home" ? 0 : event.key === "End" ? artworkOptions.length - 1 : (index + (event.key === "ArrowDown" ? 1 : -1) + artworkOptions.length) % artworkOptions.length;
            artworkOptions[next].focus();
          }
        });
        document.addEventListener("click", event => { if (!artworkDropdown.contains(event.target)) closeInfoArtworkMenu(); });
        artworkDropdown.addEventListener("keydown", event => {
          if (event.key === "Escape") { closeInfoArtworkMenu(); artworkTrigger.focus(); }
        });
        artworkDropdown.addEventListener("focusout", event => { if (!artworkDropdown.contains(event.relatedTarget)) closeInfoArtworkMenu(); });
      }
      
      function showAbilityTooltip(event, abilityName){
        const tooltip = document.getElementById("ability-tooltip");
        const description = abilityCache[abilityName]
        if (description){
          tooltip.textContent = description;
        } else{
          tooltip.textContent = "Loading...";
        }
        tooltip.classList.add("visible");
        const bounds = event.currentTarget.getBoundingClientRect();
        const x = Number.isFinite(event.clientX) ? event.clientX : bounds.left;
        const y = Number.isFinite(event.clientY) ? event.clientY : bounds.top;
        tooltip.style.left = Math.max(8, Math.min(x + 5, window.innerWidth - tooltip.offsetWidth - 8)) + "px";
        tooltip.style.top = Math.max(8, y - tooltip.offsetHeight - 10) + "px";
      }

      function hideAbilityTooltip(){
        const tooltip = document.getElementById("ability-tooltip");
        tooltip.classList.remove("visible");
      }

      let navigatingNumber = false;
      let currentPokemonNumber = 1;
      let maxPokemonNumber = 1;
      let pokemonNavigationList = [];
      async function updatePokemonNavigation() {
        const input = document.getElementById("pokemon-number");
        currentPokemonNumber = Number(input.value);
        await pokemonNamesReady;
        pokemonNavigationList = [...allPokemonNames].sort((a, b) => a.id - b.id);
        const numbers = pokemonNavigationList.map(p => p.id);
        if (!numbers.length) return;
        maxPokemonNumber = Math.max(...numbers);
        input.max = maxPokemonNumber;
        document.getElementById("previous-pokemon").disabled = currentPokemonNumber <= 1;
        document.getElementById("next-pokemon").disabled = currentPokemonNumber >= maxPokemonNumber;
      }
      async function goToPokemonNumber() {
        const input = document.getElementById("pokemon-number");
        if (navigatingNumber || !input.value.trim()) return;
        navigatingNumber = true;
        input.disabled = true;
        document.getElementById("previous-pokemon").disabled = true;
        document.getElementById("next-pokemon").disabled = true;
        const status = document.getElementById("pokemon-number-status");
        status.textContent = "Loading…";
        try {
          await pokemonNamesReady;
          const defaultPokemon = allPokemonNames;
          if (!defaultPokemon.length) throw new Error("Number list unavailable");
          const max = Math.max(...defaultPokemon.map(p => p.id));
          const number = Math.max(1, Math.min(max, Math.trunc(Number(input.value))));
          if (!Number.isFinite(number)) throw new Error("Invalid number");
          input.value = number;
          input.max = max;
          const pokemon = defaultPokemon.find(p => p.id === number);
          if (!pokemon) throw new Error("Pokémon unavailable");
          window.location.href = "pokemoninfo.html?pokemon=" + encodeURIComponent(pokemon.api);
        } catch {
          status.textContent = "Could not open Pokémon. Try again.";
          input.disabled = false;
          navigatingNumber = false;
          document.getElementById("previous-pokemon").disabled = currentPokemonNumber <= 1;
          document.getElementById("next-pokemon").disabled = currentPokemonNumber >= maxPokemonNumber;
        }
      }
      document.getElementById("pokemon-number-form").addEventListener("submit", event => {
        event.preventDefault();
        goToPokemonNumber();
      });
      document.getElementById("pokemon-number").addEventListener("change", goToPokemonNumber);
      document.getElementById("previous-pokemon").addEventListener("click", () => {
        const previous = pokemonNavigationList.filter(p => p.id < currentPokemonNumber).pop();
        if (!previous) return;
        document.getElementById("pokemon-number").value = previous.id;
        goToPokemonNumber();
      });
      document.getElementById("next-pokemon").addEventListener("click", () => {
        const next = pokemonNavigationList.find(p => p.id > currentPokemonNumber);
        if (!next) return;
        document.getElementById("pokemon-number").value = next.id;
        goToPokemonNumber();
      });
      window.addEventListener("compdex:settings-changed", event => {
        if (event.detail.previous.artwork !== event.detail.settings.artwork || event.detail.previous.shiny !== event.detail.settings.shiny) updateInfoArtwork();
      });
      loadPokemon();
    </script>
    <footer class="site-bottom-bar" aria-label="Site footer"></footer>
  </body>
</html>
