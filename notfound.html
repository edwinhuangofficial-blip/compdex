<!doctype html>
<html>
  <head><meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="notfound.css" />
    <link rel="stylesheet" href="shared.css?v=compact-header-39" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <!--adds custom font-->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
<script src="settings.js?v=animated-default-6"></script>
    <script src="fetchapi.js?v=compact-header-39"></script>
    <title>Not Found</title>
    <!--website title-->
  </head>
  <body>
    <!--same bar but the title takes u home-->
    <div class="homepagebar">
      <div class="bar-left">
        <h2 id="homebutton" onclick="window.location.replace('index.html');"><img class="site-logo" src="favicon.svg" alt="" /> CompDex</h2>
        <h3 class="page-label">Pokemon Not Found</h3>
      </div>
      <div class="bar-mid">
        <div class="searchbarbut">
          <div class="search-input-wrap">
            <input type="search" id="searchbarid" placeholder="Search name or #..." autocomplete="off" spellcheck="false" autocorrect="off" autocapitalize="none" />
            <button type="button" id="clear-search" aria-label="Clear search">
              ×
            </button>
          </div>
          <button id="searchbutton" onclick="pokeSearch()">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="22"
              height="22"
              viewBox="0 0 20 20"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <circle cx="10" cy="10" r="8" />
              <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
          </button>
          <div id="search-dropdown"></div>
        </div>
        <button id="random-pokemon" class="shuffle-button" data-shared-random type="button" aria-label="Go to a random Pokémon" title="Go to a random Pokémon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h3c5 0 7 12 12 12h3M18 15l3 3-3 3M3 18h3c2 0 3.5-2 5-4M13 10c1.5-2 3-4 5-4h3M18 3l3 3-3 3"/></svg></button>
      </div>

      <div class="bar-right">
        <button id="share-button" type="button" aria-label="Share" title="Share"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 10.5 6.8-4M8.6 13.5l6.8 4"/></svg><span>Share</span></button>
        <button id="settings-button" type="button" aria-label="Settings" title="Settings"><svg class="settings-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 3-.5 3-2 1.2-2.8-1.1-2 3.5 2.3 1.9v2.4l-2.3 1.9 2 3.5 2.8-1.1 2 1.2.5 3h4l.5-3 2-1.2 2.8 1.1 2-3.5-2.3-1.9v-2.4l2.3-1.9-2-3.5-2.8 1.1-2-1.2-.5-3Z"/><circle cx="11" cy="12" r="3"/></svg><span>Settings</span></button>
      </div>
    </div>
    <div id="notfoundbody">
         <h2 class="notfound-num">#???</h2>
      <h1 class="notfound-title">Pokémon Not Found</h1>
      <h2 class="notfound-sub" id="notfound-sub"></h2>
      <button class="home-btn" onclick="window.location.replace('index.html')">
        Back to CompDex
      </button>
    </div>
    <script>
        const searched = new URLSearchParams(window.location.search).get("pokemon")?.replace(/-/, " ");
        const sub = document.getElementById("notfound-sub");

        if(searched) {
            sub.textContent = '"' + searched + '" isn\'t a Pokémon. Check the spelling and try again.';
        } else {
        sub.textContent = "That URL doesn't match any Pokémon. Try searching instead.";
        }
    </script>
    <footer class="site-bottom-bar" aria-label="Site footer"></footer>
    </body>
    </html>
